line-length = 100
target-version = "py312"

exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    ".pytest_cache",
    ".mypy_cache",
]

[lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
]
ignore = [
    "E501",
]

[lint.per-file-ignores]
"alembic/env.py" = [
    "F401",
]
"alembic/versions/*.py" = [
    "F401",
]
