<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Register | sm1le.fitness</title>
  <link rel="icon" type="image/png" href="/static/favicon.png?v=3">
  <link rel="apple-touch-icon" href="/static/favicon.png">
  <link rel="icon" sizes="192x192" href="/static/favicon.png">
<link rel="apple-touch-icon" href="/static/favicon.png">
<style>
    :root {
      --bg: #0F172A;
      --card-bg: #1E293B;
      --accent: #F97316;
      --text: #F8FAFC;
      --text-muted: #94A3B8;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      position: relative;
      overflow: hidden;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .top-logo {
      position: absolute;
      top: 20px;
      left: 20px;
      text-decoration: none;
      color: var(--accent);
      font-weight: 800;
      font-size: 18px;
      letter-spacing: -0.5px;
      z-index: 10;
      transition: transform 0.3s;
    }

    .top-logo:hover {
      transform: scale(1.05);
    }

    .auth-card {
      background: var(--card-bg);
      padding: 32px;
      border-radius: 24px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 20px 25px rgba(0, 0, 0, 0.3);
      margin: 16px;
      position: relative;
      z-index: 1;
      animation: fadeInUp 0.6s ease-out;
    }

    h2 {
      text-align: center;
      margin: 0;
      font-size: 24px;
    }

    p.subtitle {
      color: var(--text-muted);
      text-align: center;
      margin-bottom: 24px;
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 6px;
      margin-left: 4px;
    }

    input {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid #334155;
      background: #0F172A;
      color: white;
      outline: none;
      font-size: 16px;
      transition: all 0.3s;
    }

    input:focus {
      border-color: var(--accent);
      transform: scale(1.01);
      background: #161e31;
    }

    .btn-register {
      width: 100%;
      padding: 16px;
      border-radius: 14px;
      border: none;
      background: var(--accent);
      color: white;
      font-weight: bold;
      cursor: pointer;
      font-size: 16px;
      margin-top: 10px;
      transition: 0.2s;
    }

    .btn-register:active {
      transform: scale(0.97);
    }

    .resend-button {
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid var(--accent);
      background: transparent;
      color: var(--accent);
      font-weight: 700;
      cursor: pointer;
      margin-top: 12px;
    }

    .resend-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .footer-text {
      text-align: center;
      margin-top: 20px;
      font-size: 14px;
      color: var(--text);
    }

    .footer-text a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
    }

    #message {
      text-align: center;
      margin-bottom: 12px;
      font-size: 14px;
      min-height: 18px;
    }

    .bottom-nav {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 32px);
      max-width: 400px;
      background: rgba(30, 41, 59, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 12px 16px;
      border-radius: 24px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      z-index: 1000;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      text-decoration: none;
      color: var(--text-muted);
      transition: 0.3s;
    }

    .nav-item svg {
      width: 24px;
      height: 24px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .nav-item span {
      font-size: 11px;
      font-weight: 500;
    }

    .nav-item.active {
      color: var(--accent);
    }

    .nav-item.active svg {
      /* Keep only the glow, without fill */
      filter: drop-shadow(0 0 8px rgba(249, 115, 22, 0.4));
    }
  </style>
</head>

<body>
  <a href="/" class="top-logo">sm1le.fitness</a>
  <div class="auth-card">
    <h2>Create Account</h2>
    <p class="subtitle">Start your fitness journey</p>
    <div id="message"></div>
    <form id="register-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <div class="form-group">
        <label>Username</label>
        <input type="text" name="username" placeholder="Choose a username" required>
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" name="email" placeholder="example@mail.com" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" placeholder="Minimum 6 characters" required>
      </div>
      <button type="submit" class="btn-register">Register</button>
    </form>

    <button
      type="button"
      id="resend-button"
      class="resend-button"
      hidden
    >
      Resend verification email
    </button>

    <div class="footer-text">
      Already have an account? <a href="/auth/login">Sign In</a>
    </div>
  </div>
  <nav class="bottom-nav">
    <a href="/" class="nav-item">
      <svg viewBox="0 0 24 24">
        <path
          d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
      </svg>
      <span>Home</span>
    </a>
    <a href="/auth/welcome" class="nav-item">
      <svg viewBox="0 0 24 24">
        <path
          d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01" />
      </svg>
      <span>Plans</span>
    </a>
    <a href="/auth/profile" class="nav-item">
      <svg viewBox="0 0 24 24">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
        <circle cx="12" cy="7" r="4"></circle>
      </svg>
      <span>Profile</span>
    </a>
  </nav>
  <script>
    const registerForm = document.getElementById('register-form');
    const resendButton = document.getElementById('resend-button');
    const msgEl = document.getElementById('message');

    let registeredEmail = '';

    function getCsrfToken() {
      const input = registerForm.querySelector(
        'input[name="csrf_token"]'
      );

      return input ? input.value : '';
    }

    registerForm.onsubmit = async (e) => {
      e.preventDefault();

      msgEl.innerText = 'Creating account...';
      msgEl.style.color = 'var(--text-muted)';

      const formData = new FormData(e.target);
      const jsonData = Object.fromEntries(
        formData.entries()
      );

      try {
        const res = await fetch(
          '/auth/register',
          {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify(jsonData)
          }
        );

        const data = await res.json();

        if (res.ok) {
          registeredEmail = jsonData.email;

          msgEl.style.color = '#22c55e';
          msgEl.innerText =
            'Account created. Check your email and verify your address.';

          registerForm
            .querySelectorAll('input, button')
            .forEach(element => {
              element.disabled = true;
            });

          resendButton.hidden = false;
          return;
        }

        msgEl.style.color = '#ef4444';

        if (Array.isArray(data.detail)) {
          msgEl.innerText = data.detail[0].msg;
        } else {
          msgEl.innerText =
            data.detail || 'Registration failed';
        }
      } catch (err) {
        console.error(err);
        msgEl.style.color = '#ef4444';
        msgEl.innerText =
          'Failed to connect to the server';
      }
    };

    resendButton.addEventListener(
      'click',
      async () => {
        if (!registeredEmail) {
          return;
        }

        resendButton.disabled = true;
        resendButton.textContent = 'Sending...';

        try {
          const response = await fetch(
            '/auth/resend-verification',
            {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json'
              },
              body: JSON.stringify({
                email: registeredEmail,
                csrf_token: getCsrfToken()
              })
            }
          );

          const data = await response.json();

          if (!response.ok) {
            msgEl.style.color = '#ef4444';
            msgEl.textContent =
              data.detail || 'Failed to send verification email';
            return;
          }

          msgEl.style.color = '#22c55e';
          msgEl.textContent = data.message;
        } catch (error) {
          console.error(error);
          msgEl.style.color = '#ef4444';
          msgEl.textContent = 'Network error';
        } finally {
          setTimeout(() => {
            resendButton.disabled = false;
            resendButton.textContent =
              'Resend verification email';
          }, 60000);
        }
      }
    );
  </script>
</body>

</html>
