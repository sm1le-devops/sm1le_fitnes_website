<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Questionnaire — sm1le.fitness</title>
  <link rel="icon" type="image/png" href="/static/favicon.png?v=3">
  <link rel="apple-touch-icon" href="/static/favicon.png">
  <link rel="icon" sizes="192x192" href="/static/favicon.png">
<style>
        :root {
            --bg: #0F172A;
            --card-bg: #1E293B;
            --accent: #F97316;
            --text: #F8FAFC;
            --text-muted: #94A3B8;
        }

        body {
            margin: 0;
            background-color: var(--bg);
            color: var(--text);
            font-family: -apple-system, sans-serif;
        }

        .app-wrapper {
            padding: 40px 16px;
            max-width: 500px;
            margin: 0 auto;
        }

        .greeting h1 {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .greeting p {
            color: var(--text-muted);
            margin-bottom: 32px;
        }

        .auth-form {
            background: var(--card-bg);
            padding: 24px;
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .input-group label {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-muted);
        }

        select,
        input {
            background: #0F172A;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 14px;
            border-radius: 12px;
            color: white;
            font-size: 16px;
            outline: none;
        }

        /* Shared button style */
        .btn-generate {
            background: var(--accent);
            color: white;
            border: none;
            padding: 18px;
            border-radius: 16px;
            font-weight: 800;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-generate:active {
            transform: scale(0.98);
        }

        .btn-generate:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        /* Loader style */
        .loader {
            width: 18px;
            height: 18px;
            border: 2px solid #FFF;
            border-bottom-color: transparent;
            border-radius: 50%;
            display: none;
            animation: rotation 1s linear infinite;
        }

        @keyframes rotation {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .back-btn-circle {
            position: fixed;
            /* Keep the button fixed while scrolling */
            top: 20px;
            left: 16px;
            z-index: 100;
            background: rgba(30, 41, 59, 0.6);
            /* Semi-transparent background */
            backdrop-filter: blur(8px);
            /* Background blur effect */
            -webkit-backdrop-filter: blur(8px);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            text-decoration: none;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: 0.2s;
        }

        .back-btn-circle:active {
            transform: scale(0.9);
            background: rgba(30, 41, 59, 0.9);
        }
    </style>
</head>

<body>
    <a href="javascript:history.back()" class="back-btn-circle">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M15 18l-6-6 6-6" />
        </svg>
    </a>
    <div class="app-wrapper">

        <div class="greeting">
            <h1>Almost ready!</h1>
            <p>Complete the questionnaire and our AI will create your personalized workout plan.</p>
        </div>

        <form id="ai-form" class="auth-form" method="POST" action="/generate-plan/{{ plan_id }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <div class="input-group">
                <label>Your Training Experience</label>
                <select name="experience" required>
                    <option value="beginner">Beginner (0-1 year)</option>
                    <option value="middle">Intermediate (1-3 years)</option>
                    <option value="pro">Advanced (3+ years)</option>
                </select>
            </div>

            <div class="input-group">
                <label>Injuries or Limitations</label>
                <input type="text" name="injuries" value="none" required>
            </div>

            <div class="input-group">
                <label>Where Do You Train?</label>
                <select name="equipment">
                    <option value="gym">Gym (full equipment)</option>
                    <option value="home">Home (dumbbells or bodyweight)</option>
                    <option value="street">Outdoor (pull-up and parallel bars)</option>
                </select>
            </div>
            <div class="input-group">
                <label>Gender</label>
                <select name="gender" required>
                    <option value="male">Male</option>
                    <option value="female">Female</option>
                </select>
            </div>

            <div class="input-group">
                <label>Age</label>
                <input type="number" name="age" placeholder="For example: 25" required>
            </div>

            <div class="input-group">
                <label>Weight (kg)</label>
                <input type="number" step="0.1" name="weight" placeholder="For example: 75.5" required>
            </div>

            <div class="input-group">
                <label>Height (cm)</label>
                <input type="number" name="height" placeholder="For example: 180" required>
            </div>

            <button type="submit" id="submitBtn" class="btn-generate">
                <span id="btnText">🚀 Generate My Plan</span>
                <div id="loader" class="loader"></div>
            </button>

        </form>
    </div>

    <script>
        document.getElementById('ai-form').onsubmit = function () {
            const btn = document.getElementById('submitBtn');
            const text = document.getElementById('btnText');
            const loader = document.getElementById('loader');

            // Disable the button to prevent duplicate submissions
            btn.disabled = true;
            text.innerText = "AI is creating your plan...";
            loader.style.display = "inline-block";
        };
    </script>

</body>

</html>
