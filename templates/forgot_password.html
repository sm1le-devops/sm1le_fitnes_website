<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>Password Recovery | sm1le.fitness</title>

  <link
    rel="icon"
    type="image/png"
    href="/static/favicon.png?v=3"
  >
  <link
    rel="apple-touch-icon"
    href="/static/favicon.png"
  >
  <link
    rel="icon"
    sizes="192x192"
    href="/static/favicon.png"
  >

  <style>
    :root {
      --bg: #0F172A;
      --card-bg: #1E293B;
      --accent: #F97316;
      --accent-hover: #EA580C;
      --text: #F8FAFC;
      --text-muted: #94A3B8;
      --input-bg: #0F172A;
      --border: #334155;
      --success: #22C55E;
      --error: #EF4444;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: sans-serif;

      display: flex;
      align-items: center;
      justify-content: center;

      position: relative;
      overflow: hidden;
    }

    .top-logo {
      position: absolute;
      top: 20px;
      left: 20px;

      text-decoration: none;
      color: var(--accent);

      font-weight: 800;
      font-size: 18px;
      letter-spacing: -0.5px;

      z-index: 10;
    }

    .background-glow {
      position: absolute;
      width: 420px;
      height: 420px;
      border-radius: 50%;

      background: rgba(249, 115, 22, 0.08);
      filter: blur(80px);

      pointer-events: none;
    }

    .glow-top {
      top: -220px;
      right: -150px;
    }

    .glow-bottom {
      bottom: -250px;
      left: -150px;
    }

    @keyframes fadeScale {
      0% {
        opacity: 0;
        transform: scale(0.96);
      }

      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    .auth-card {
      width: 100%;
      max-width: 400px;

      margin: 16px;
      padding: 32px;

      background: var(--card-bg);

      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 24px;

      box-shadow:
        0 20px 25px rgba(0, 0, 0, 0.3);

      position: relative;
      z-index: 2;

      animation:
        fadeScale 0.35s ease-out forwards;
    }

    .icon-wrapper {
      width: 58px;
      height: 58px;

      margin: 0 auto 18px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 18px;

      background: rgba(249, 115, 22, 0.12);
      color: var(--accent);
    }

    .icon-wrapper svg {
      width: 28px;
      height: 28px;

      fill: none;
      stroke: currentColor;
      stroke-width: 2;

      stroke-linecap: round;
      stroke-linejoin: round;
    }

    h2 {
      margin: 0 0 8px 0;

      text-align: center;

      font-size: 24px;
      font-weight: 700;
    }

    .subtitle {
      margin: 0 0 24px;

      color: var(--text-muted);

      text-align: center;
      font-size: 14px;
      line-height: 1.5;
    }

    input {
      width: 100%;

      padding: 14px;

      margin-bottom: 16px;

      border-radius: 12px;
      border: 1px solid var(--border);

      background: var(--input-bg);
      color: var(--text);

      outline: none;

      font-size: 16px;

      transition:
        border-color 0.2s,
        background 0.2s,
        box-shadow 0.2s;
    }

    input::placeholder {
      color: var(--text-muted);
    }

    input:focus {
      border-color: var(--accent);

      background: #161E31;

      box-shadow:
        0 0 0 3px rgba(249, 115, 22, 0.1);
    }

    .btn-auth {
      width: 100%;

      padding: 16px;

      border: none;
      border-radius: 14px;

      background: var(--accent);
      color: white;

      font-size: 16px;
      font-weight: 700;

      cursor: pointer;

      transition:
        background 0.2s,
        transform 0.2s,
        opacity 0.2s;
    }

    .btn-auth:hover:not(:disabled) {
      background: var(--accent-hover);
    }

    .btn-auth:active:not(:disabled) {
      transform: scale(0.98);
    }

    .btn-auth:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }

    #message {
      min-height: 20px;

      margin: 16px 0 0;

      text-align: center;

      font-size: 14px;
      font-weight: 500;

      line-height: 1.4;
    }

    .footer-links {
      margin-top: 20px;

      text-align: center;

      font-size: 14px;
    }

    .footer-links a {
      color: var(--accent);

      text-decoration: none;

      font-weight: 600;

      transition: color 0.2s;
    }

    .footer-links a:hover {
      color: #FB923C;
    }

    @media (max-width: 480px) {
      .auth-card {
        padding: 28px 22px;
        border-radius: 20px;
      }

      .top-logo {
        top: 16px;
        left: 16px;
      }
    }
  </style>
</head>

<body>

  <a
    href="/"
    class="top-logo"
  >
    sm1le.fitness
  </a>

  <div class="background-glow glow-top"></div>
  <div class="background-glow glow-bottom"></div>

  <div class="auth-card">

    <div class="icon-wrapper">
      <svg viewBox="0 0 24 24">
        <rect
          x="3"
          y="5"
          width="18"
          height="14"
          rx="2"
        ></rect>

        <path
          d="M3 7l9 6 9-6"
        ></path>
      </svg>
    </div>

    <h2>
      Password recovery
    </h2>

    <p class="subtitle">
      Enter your email address and we'll send you
      a secure link to reset your password.
    </p>

    <form
      id="reset-form"
      novalidate
    >

      <input
        type="email"
        id="email"
        name="email"
        placeholder="Email address"
        autocomplete="email"
        required
      >

      <button
        type="submit"
        id="submit-btn"
        class="btn-auth"
      >
        Send recovery link
      </button>

    </form>

    <p id="message"></p>

    <div class="footer-links">
      <a href="/auth/login">
        Back to sign in
      </a>
    </div>

  </div>

  <script>
    const form =
      document.getElementById(
        'reset-form'
      );

    const message =
      document.getElementById(
        'message'
      );

    const submitBtn =
      document.getElementById(
        'submit-btn'
      );

    const COOLDOWN_SECONDS = 600;

    let cooldown = 0;
    let interval = null;


    function initCooldown() {
      const storedTime =
        localStorage.getItem(
          'resetCooldown'
        );

      if (!storedTime) {
        return;
      }

      const remaining = Math.ceil(
        (
          Number(storedTime)
          - Date.now()
        )
        / 1000
      );

      if (remaining > 0) {
        startCooldown(
          remaining
        );
      } else {
        localStorage.removeItem(
          'resetCooldown'
        );
      }
    }


    function startCooldown(
      seconds
    ) {
      cooldown = seconds;

      submitBtn.disabled = true;

      updateButtonText();

      localStorage.setItem(
        'resetCooldown',
        String(
          Date.now()
          + cooldown * 1000
        )
      );

      clearInterval(
        interval
      );

      interval = setInterval(
        () => {
          cooldown--;

          updateButtonText();

          if (cooldown <= 0) {
            clearInterval(
              interval
            );

            interval = null;

            submitBtn.disabled =
              false;

            submitBtn.textContent =
              'Send recovery link';

            localStorage.removeItem(
              'resetCooldown'
            );
          }
        },
        1000
      );
    }


    function updateButtonText() {
      if (cooldown > 0) {
        const minutes =
          Math.floor(
            cooldown / 60
          );

        const seconds =
          cooldown % 60;

        submitBtn.textContent =
          `Resend in ${minutes}:${
            String(seconds)
              .padStart(2, '0')
          }`;
      }
    }


    form.addEventListener(
      'submit',
      async (e) => {
        e.preventDefault();

        if (cooldown > 0) {
          return;
        }

        const email =
          form.email.value.trim();

        if (!email) {
          message.textContent =
            'Enter your email address';

          message.style.color =
            'var(--error)';

          return;
        }

        submitBtn.disabled = true;

        submitBtn.textContent =
          'Sending...';

        message.textContent = '';

        try {
          const res = await fetch(
            '/auth/forgot-password',
            {
              method: 'POST',

              headers: {
                'Content-Type':
                  'application/json'
              },

              body: JSON.stringify({
                email
              })
            }
          );

          const data =
            await res.json();

          if (!res.ok) {
            message.textContent =
              data.detail
              || 'Recovery error';

            message.style.color =
              'var(--error)';

            submitBtn.disabled =
              false;

            submitBtn.textContent =
              'Send recovery link';

            return;
          }

          message.textContent =
            data.message
            || 'Check your email!';

          message.style.color =
            'var(--success)';

          startCooldown(
            COOLDOWN_SECONDS
          );

        } catch {
          message.textContent =
            'Server connection error';

          message.style.color =
            'var(--error)';

          submitBtn.disabled =
            false;

          submitBtn.textContent =
            'Send recovery link';
        }
      }
    );


    initCooldown();
  </script>

</body>

</html>
