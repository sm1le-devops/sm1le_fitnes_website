name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql+psycopg2://postgres@localhost:5432/sm1le_ci
  REDIS_URL: redis://localhost:6379/0
  CSRF_SECRET: ci-csrf-secret-not-for-production
  JWT_SECRET_KEY: ci-jwt-secret-not-for-production
  YOUR_DOMAIN: http://localhost:8000
  RENDER_EXTERNAL_URL: ""

jobs:
  quality:
    name: Quality gates / Python 3.12
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: sm1le_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sm1le_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          python -m pip install "poetry>=2.1,<3"

      - name: Validate Poetry files
        run: poetry check --lock

      - name: Install dependencies
        run: poetry install --no-interaction --no-ansi --no-root

      - name: Ruff
        run: poetry run ruff check .

      - name: Mypy baseline
        run: |
          poetry run mypy \
            core \
            services \
            dependencies.py \
            database.py \
            models.py \
            schemas.py

      - name: Apply migrations on clean PostgreSQL
        run: poetry run alembic upgrade head

      - name: Check migration/model drift
        run: poetry run alembic check

      - name: Pytest
        run: poetry run pytest -q

      - name: Dependency vulnerability audit
        run: poetry run pip-audit

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - quality

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build production image
        run: |
          docker build \
            --tag sm1le-fitness:${{ github.sha }} \
            .

  deploy:
    name: Deploy and verify production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - quality
      - docker

    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    env:
      PRODUCTION_URL: https://sm1le-fitnes-website-pojo.onrender.com

    steps:
      - name: Trigger exact commit on Render
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "RENDER_DEPLOY_HOOK_URL secret is not configured"
            exit 1
          fi

          DEPLOY_URL="$RENDER_DEPLOY_HOOK_URL"

          if [[ "$DEPLOY_URL" == *"?"* ]]; then
            DEPLOY_URL="${DEPLOY_URL}&ref=${GITHUB_SHA}"
          else
            DEPLOY_URL="${DEPLOY_URL}?ref=${GITHUB_SHA}"
          fi

          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --request POST \
            "$DEPLOY_URL"

          echo
          echo "Render deploy triggered for commit ${GITHUB_SHA}"

      - name: Wait for exact production release
        run: |
          echo "Waiting for production commit ${GITHUB_SHA}"

          for attempt in $(seq 1 60); do
            HTTP_CODE=$(curl \
              --silent \
              --show-error \
              --output /tmp/ready.json \
              --write-out "%{http_code}" \
              "${PRODUCTION_URL}/ready" \
              || true)

            echo "Attempt ${attempt}/60 - HTTP ${HTTP_CODE}"

            if [ "$HTTP_CODE" = "200" ]; then
              if grep -Fq "${GITHUB_SHA}" /tmp/ready.json; then
                echo "Correct commit is live and ready"
                cat /tmp/ready.json
                exit 0
              fi
            fi

            sleep 10
          done

          echo "Production did not become ready with commit ${GITHUB_SHA}"
          cat /tmp/ready.json || true
          exit 1

      - name: Production smoke tests
        run: |
          check_endpoint() {
            PATH_TO_CHECK="$1"

            STATUS=$(curl \
              --silent \
              --show-error \
              --output /dev/null \
              --write-out "%{http_code}" \
              "${PRODUCTION_URL}${PATH_TO_CHECK}")

            echo "${PATH_TO_CHECK} -> ${STATUS}"

            if [ "$STATUS" != "200" ]; then
              exit 1
            fi
          }

          check_endpoint "/health"
          check_endpoint "/ready"
          check_endpoint "/"
          check_endpoint "/auth/login"
          check_endpoint "/auth/register"

          echo "Production smoke tests passed"